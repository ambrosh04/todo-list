
apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-list-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: todo-list

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5

  template:
    metadata:
      labels:
        app: todo-list

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: todo-list-container
          image: 569378724334.dkr.ecr.ap-south-1.amazonaws.com/devops-assessment:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /todos/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
            successThreshold: 1
