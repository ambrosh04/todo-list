name: Deploy to ECS

on:
  push:
    branches: [develop]

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy to ECS
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Verify AWS credentials
      run: aws s3 ls

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: todo-list
        IMAGE_TAG: latest
      run:
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Register new ECS task definition
      id: register-task
      uses: aws-actions/amazon-ecs-register-task-definition@v1
      with:
        family: todo-list-TD
        container-name: todo-list-container
        container-image: ${{ steps.login-ecr.outputs.registry }}/todo-list:latest
        aws-region: us-east-1

    - name: Deploy to Amazon ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        service: todo-list-SVC
        cluster: todo-list-cluster
        task-definition: ${{ steps.register-task.outputs.task-definition }}
        aws-region: us-east-1
